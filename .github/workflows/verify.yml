name: Verify application

on:
  pull_request:
  push:
    branches: [main, codex/launch-pass]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm start &
      - run: npm run healthcheck
